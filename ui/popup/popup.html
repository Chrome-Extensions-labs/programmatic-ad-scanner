<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Programmatic Ad-scanner</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <h1 class="header__title">Programmatic Ad-scanner</h1>
    <span class="header__version">v2.0.3</span>
  </header>

  <main class="main">
    <div class="actions">
      <button id="scanBtn" class="btn btn--primary" type="button">
        <span class="btn__label">Scan Page</span>
      </button>
      <button id="clearBtn" class="btn btn--secondary" type="button" disabled>
        <span class="btn__label">Clear</span>
      </button>
    </div>

    <div id="statusArea" class="status" role="status" aria-live="polite"></div>

    <section id="resultsArea" class="results" hidden>
      <h2 class="section__title">Summary</h2>
      <div class="stats-grid">
        <div class="stat">
          <span class="stat__value" id="totalCount">0</span>
          <span class="stat__label">Total Ads</span>
        </div>
        <div class="stat stat--google">
          <span class="stat__value" id="googleCount">0</span>
          <span class="stat__label">Google</span>
        </div>
        <div class="stat stat--prebid">
          <span class="stat__value" id="prebidCount">0</span>
          <span class="stat__label">Prebid</span>
        </div>
        <div class="stat stat--amazon">
          <span class="stat__value" id="amazonCount">0</span>
          <span class="stat__label">Amazon</span>
        </div>
      </div>

      <h2 class="section__title">Ad Tech Signals</h2>
      <ul class="signals" id="signalsList"></ul>

      <h2 class="section__title">Detected Units</h2>
      <div class="units" id="unitsList">
        <p class="units__empty">No units captured.</p>
      </div>
    </section>
  </main>

  <div class="oss-bar">
    <span class="oss-bar__text">Open-source project:</span>
    <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/programmatic-ad-scanner" target="_blank" rel="noopener noreferrer">
      GitHub
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
